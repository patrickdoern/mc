name: Website
on:
  push:
    branches: [main]
    paths: [website/**]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Downloads aller Releases eintragen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].assets[].download_count' | awk '{s+=$1} END {print s+0}')
          de=$(echo "$total" | sed -e ':a' -e 's/\([0-9]\)\([0-9]\{3\}\)\($\|\.\)/\1.\2\3/; ta')
          en=$(echo "$total" | sed -e ':a' -e 's/\([0-9]\)\([0-9]\{3\}\)\($\|,\)/\1,\2\3/; ta')
          sed -i "s|<span class=\"downloads\">[^<]*</span>|<span class=\"downloads\">$de</span>|" website/index.html
          sed -i "s|<span class=\"downloads\">[^<]*</span>|<span class=\"downloads\">$en</span>|" website/en/index.html
          grep -h 'class="downloads"' website/index.html website/en/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
